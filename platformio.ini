; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Plataforma común a las tres placas: pioarduino con versión FIJA (Arduino 3.3.8 / IDF 5.5), para que
; una versión nueva de «stable» no rompa el CI sin que cambie nada nuestro. Actualizar a propósito.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
gfx = moononournation/GFX Library for Arduino@1.6.9
; LVGL FIJADO (antes ^9.2, que resolvía a lo último en cada CI). Sunton: 9.5.0, la que lleva meses
; en producción. P4: 9.6.0, la que se midió y se probó con la unidad PPA (el adaptador
; src/ppa_cache_shim.cpp y las comprobaciones de lv_draw_ppa_private.h dependen de esa versión).
; Subirlas a propósito y recompilar las tres placas.
lvgl_s3 = lvgl/lvgl@9.5.0
lvgl_p4 = lvgl/lvgl@9.6.0
; Aceleración PPA del ESP32-P4 (DEYE: ver docs/experimento-ppa.md). LV_USE_PPA activa la unidad de
; dibujo de LVGL; la alineación de los búferes debe igualar la línea de caché L2 del P4 (128 B) y
; lv_draw_ppa_private.h la exige como CONFIG_LV_DRAW_BUF_ALIGN, que el sdkconfig.h precompilado de
; Arduino no define. El shim aporta esp_cache_get_line_size_by_addr() (no existe en IDF 5.5).
; Para desactivar el PPA en una placa basta quitar estas banderas (la rotación de la JC4880P443C
; vuelve sola a GFX) o añadir -DDEYE_NO_PPA_ROTATE para quitar solo la rotación.
ppa_flags =
	-DLV_USE_PPA=1
	-DLV_DRAW_BUF_ALIGN=128
	-DCONFIG_LV_DRAW_BUF_ALIGN=128
	-include ppa_cache_shim.h

[env:sunton_4827s043]
platform = ${common.platform}
board = esp32s3box
framework = arduino
extra_scripts = pre:scripts/git_version.py
; Análisis estático (DEYE-63): `pio check -e sunton_4827s043`. Solo nuestro código:
; las cabeceras de las librerías dan falsos positivos (p. ej. macros de ArduinoJson).
check_tool = cppcheck
check_skip_packages = yes
check_severity = high, medium
check_flags =
	cppcheck: --suppress=*:*/.pio/libdeps/* --suppress=*:*/.platformio/*
check_src_filters = +<src/>
lib_deps =
	${common.lvgl_s3}
	${common.gfx}
	tamctec/TAMC_GT911@^1.0.2
	witnessmenow/UniversalTelegramBot@^1.3.0
    bblanchon/ArduinoJson@^7.0.0
	knolleary/PubSubClient@^2.8
upload_speed = 460800
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags = 
    -Iinclude
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
	-DBOARD_ESP32_SUNTON_4827S043
	-DFW_ENV_NAME=\"sunton_4827s043\"
	-DDBGSERIAL=DbgSerial
	-DDBG_UART=Serial0
	-DSCREEN_WIDTH=480
	-DSCREEN_HEIGHT=270
	-DFONT_SMALL_SIZE=12
	-DFONT_SMALL=lv_font_montserrat_12
	-DFONT_NORMAL_SIZE=14
	-DFONT_NORMAL=lv_font_montserrat_14
	-DFONT_LARGE_SIZE=28
	-DFONT_LARGE=lv_font_montserrat_28
	-DFONT_MEDIUM_SIZE=22
	-DFONT_MEDIUM=lv_font_montserrat_22

