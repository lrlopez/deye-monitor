; Tests unitarios de lógica pura (sin hardware): `pio test -e native`
; Cubren solarman_proto.h, slot_avg.h y time_utils.h (headers sin dependencias
; de Arduino). No se compila src/ en este entorno y CI no lo despliega.
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
build_flags =
	-std=gnu++17
	-Isrc
ci_skip = true
