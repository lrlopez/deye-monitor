; Banco de pruebas de rendimiento (no es para release): igual que guition_jc1060p470 + medición de
; los tiempos de render y de flush por consola cada 5 s (ver docs/experimento-ppa.md). ci_skip evita
; que CI publique un segundo .bin con el mismo FW_ENV_NAME que la placa de producción.
[env:guition_jc1060p470_bench]
extends = env:guition_jc1060p470
ci_skip = true
build_flags =
	${env:guition_jc1060p470.build_flags}
	-DPPA_BENCH

